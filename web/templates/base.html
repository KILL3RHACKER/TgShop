<!DOCTYPE html>
<html lang="ru" class="dark h-full bg-slate-950 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Панель управления{% endblock %} — TG Shop Admin</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            900: '#312e81',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        /* Custom scrollbar for dark theme */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
    {% block head %}{% endblock %}
</head>
<body class="h-full antialiased flex flex-col md:flex-row bg-slate-950 text-slate-100">

    <!-- Mobile Top Bar -->
    <div class="md:hidden flex items-center justify-between px-4 py-3 bg-slate-900 border-b border-slate-800 z-30 sticky top-0">
        <div class="flex items-center space-x-2">
            <span class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center text-white shadow-lg shadow-indigo-500/20">
                <i class="fa-solid fa-bolt"></i>
            </span>
            <span class="font-bold text-lg text-white">TG Shop Admin</span>
        </div>
        <button id="mobile-menu-btn" class="p-2 text-slate-400 hover:text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <i class="fa-solid fa-bars text-xl"></i>
        </button>
    </div>

    <!-- Sidebar Overlay (Mobile) -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-40 hidden md:hidden"></div>

    <!-- Sidebar -->
    <aside id="sidebar" class="fixed inset-y-0 left-0 z-50 w-64 bg-slate-900 border-r border-slate-800/80 flex flex-col transition-transform duration-200 ease-in-out -translate-x-full md:translate-x-0 md:static md:z-auto">
        <!-- Logo Header -->
        <div class="p-5 border-b border-slate-800 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center text-white shadow-lg shadow-indigo-500/25">
                    <i class="fa-solid fa-shop"></i>
                </div>
                <div>
                    <h1 class="font-bold text-base tracking-wide text-white">TG Shop Panel</h1>
                    <p class="text-xs text-slate-400">Inventory & Orders</p>
                </div>
            </div>
            <button id="sidebar-close-btn" class="md:hidden text-slate-400 hover:text-white">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
        </div>

        <!-- Navigation Links -->
        <nav class="flex-1 p-4 space-y-1.5 overflow-y-auto">
            <a href="/" class="flex items-center space-x-3 px-3.5 py-2.5 rounded-xl font-medium text-sm transition-all {% if active_tab == 'dashboard' %}bg-indigo-600/20 text-indigo-400 border border-indigo-500/30 font-semibold{% else %}text-slate-400 hover:text-slate-200 hover:bg-slate-800/60{% endif %}">
                <i class="fa-solid fa-chart-pie w-5 text-center text-base"></i>
                <span>Дашборд</span>
            </a>

            <a href="/accounts" class="flex items-center space-x-3 px-3.5 py-2.5 rounded-xl font-medium text-sm transition-all {% if active_tab == 'accounts' %}bg-indigo-600/20 text-indigo-400 border border-indigo-500/30 font-semibold{% else %}text-slate-400 hover:text-slate-200 hover:bg-slate-800/60{% endif %}">
                <i class="fa-solid fa-boxes-stacked w-5 text-center text-base"></i>
                <span>Аккаунты</span>
            </a>

            <a href="/tickets" class="flex items-center space-x-3 px-3.5 py-2.5 rounded-xl font-medium text-sm transition-all {% if active_tab == 'tickets' %}bg-indigo-600/20 text-indigo-400 border border-indigo-500/30 font-semibold{% else %}text-slate-400 hover:text-slate-200 hover:bg-slate-800/60{% endif %}">
                <i class="fa-solid fa-ticket w-5 text-center text-base"></i>
                <span>Тикеты</span>
            </a>

            <a href="/products" class="flex items-center space-x-3 px-3.5 py-2.5 rounded-xl font-medium text-sm transition-all {% if active_tab == 'products' %}bg-indigo-600/20 text-indigo-400 border border-indigo-500/30 font-semibold{% else %}text-slate-400 hover:text-slate-200 hover:bg-slate-800/60{% endif %}">
                <i class="fa-solid fa-tags w-5 text-center text-base"></i>
                <span>Товары и Категории</span>
            </a>

            <a href="/users" class="flex items-center space-x-3 px-3.5 py-2.5 rounded-xl font-medium text-sm transition-all {% if active_tab == 'users' %}bg-indigo-600/20 text-indigo-400 border border-indigo-500/30 font-semibold{% else %}text-slate-400 hover:text-slate-200 hover:bg-slate-800/60{% endif %}">
                <i class="fa-solid fa-users w-5 text-center text-base"></i>
                <span>Пользователи</span>
            </a>
        </nav>

        <!-- Admin Profile / Footer -->
        <div class="p-4 border-t border-slate-800 bg-slate-900/60">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <div class="w-8 h-8 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center text-indigo-400 font-semibold text-xs">
                        <i class="fa-solid fa-user-shield"></i>
                    </div>
                    <div>
                        <p class="text-xs font-semibold text-white truncate w-24">{{ admin }}</p>
                        <p class="text-[10px] text-emerald-400 flex items-center">
                            <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 inline-block mr-1"></span> Online
                        </p>
                    </div>
                </div>
                <a href="/logout" title="Выйти" class="p-2 text-slate-400 hover:text-rose-400 rounded-lg hover:bg-slate-800 transition-colors">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i>
                </a>
            </div>
        </div>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col min-w-0 overflow-y-auto">
        <!-- Toast Flash Notification -->
        {% if msg %}
        <div id="toast-banner" class="m-4 md:m-6 mb-0 p-4 rounded-xl border flex items-center justify-between shadow-xl transition-all duration-300 {% if msg_type == 'error' %}bg-rose-950/80 border-rose-800 text-rose-200{% elif msg_type == 'warning' %}bg-amber-950/80 border-amber-800 text-amber-200{% else %}bg-emerald-950/80 border-emerald-800 text-emerald-200{% endif %}">
            <div class="flex items-center space-x-3">
                <i class="{% if msg_type == 'error' %}fa-solid fa-triangle-exclamation text-rose-400{% elif msg_type == 'warning' %}fa-solid fa-circle-exclamation text-amber-400{% else %}fa-solid fa-circle-check text-emerald-400{% endif %} text-lg"></i>
                <span class="text-sm font-medium">{{ msg }}</span>
            </div>
            <button onclick="document.getElementById('toast-banner').remove()" class="text-slate-400 hover:text-white p-1">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        {% endif %}

        <div class="p-4 md:p-8 flex-1">
            {% block content %}{% endblock %}
        </div>
    </main>

    <!-- Sidebar Mobile Toggle Script -->
    <script>
        const menuBtn = document.getElementById('mobile-menu-btn');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebar-overlay');
        const closeBtn = document.getElementById('sidebar-close-btn');

        function toggleSidebar() {
            sidebar.classList.toggle('-translate-x-full');
            overlay.classList.toggle('hidden');
        }

        if (menuBtn) menuBtn.addEventListener('click', toggleSidebar);
        if (overlay) overlay.addEventListener('click', toggleSidebar);
        if (closeBtn) closeBtn.addEventListener('click', toggleSidebar);

        // Auto hide toast after 6 seconds
        const toast = document.getElementById('toast-banner');
        if (toast) {
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 6000);
        }
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
